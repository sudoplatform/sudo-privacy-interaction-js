# The provider type of the virtual presence.
enum ProviderType {
  EMAIL
}

# The possible states of a virtual presence.
enum VirtualPresenceState {
  CONNECTED
  SCANNING
  NEEDS_REAUTH
  ERROR
  INACTIVE
}

enum AnalysisResultStatus {
  PENDING
  COMPLETE
  PARTIAL
  FAILED
  UNAVAILABLE
}

# Tri-state signal value representing confidence in a determination.
enum SignalValue {
  YES
  NO
  UNKNOWN
}

# Categories of personal data as identified in a privacy policy.
enum DataCategory {
  ACCOUNT_PROFILE
  AUTHENTICATION
  BACKGROUND
  BIOMETRIC
  COMMUNICATION
  CONTACTS
  DEMOGRAPHIC
  DEVICE_IDENTIFIER
  FINANCIAL
  GOVERNMENT_ISSUED
  HEALTH
  INFERENCES
  LOCATION
  OTHER
  PII
  THIRD_PARTY_DATA
  USAGE
}

# How the data retention period is measured.
enum RetentionStyle {
  INDEFINITE
  RELATIVE_TO_ACCOUNT_CLOSURE_TIME
  RELATIVE_TO_DATA_STORAGE_TIME
  OTHER
}

# Business category for an organization.
enum OrganizationCategory {
  Finance
  Cryptocurrency
  Insurance
  EnergyAndUtilities
  Communications
  Government
  Military
  RealEstate
  Shopping
  ShippingAndDelivery
  FoodAndDining
  Automotive
  Travel
  Transportation
  Entertainment
  News
  VideoGames
  Gambling
  SportsAndFitness
  SocialMedia
  Dating
  CommunityAndCharity
  Health
  Education
  Employment
  Technology
  PrivacyAndSecurity
  PersonalEmail
  Other
}

# Brand identity and business categorization for an organization.
type OrganizationIdentity @aws_cognito_user_pools @aws_iam {
  # The consumer-facing brand name (e.g. "Facebook").
  brandName: String
  # The company that owns the brand (e.g. "Meta").
  companyName: String
  # The single most representative business category.
  primaryCategory: OrganizationCategory
  # All applicable business categories (includes primary).
  categories: [OrganizationCategory!]!
}

# The protection state of a data holder.
enum DataHolderProtectionState {
  MONITORED
  ACTION_REQUESTED
  RESOLVED
}

# How data sharing for a category is classified.
enum ShareStyle {
  SHARED
  SHARED_WITH_CONSENT
  INFERENCE_SHARED
  NONE
}

# Retention details for a specific data category.
type RetentionInfo {
  # How the retention period is expressed.
  style: RetentionStyle!
  # Retention period in days, when specified.
  timeInDays: Int
  # Free-text clarification from the policy.
  additionalInfo: String
}

# Privacy signals specific to a single data category.
type CategorySignals {
  # The data category these signals apply to.
  category: DataCategory!
  # Is this category of data collected?
  collected: SignalValue!
  # Specific data labels collected within this category (e.g. "GPS location", "payment transactions").
  dataLabels: [String!]!
  # Is this category shared with third parties?
  sharedWithThirdParties: ShareStyle!
  # Is this category used for advertising/monetization?
  usedForAdvertising: SignalValue!
  # Is this category retained?
  retained: SignalValue!
  # Retention details when retained is YES.
  retention: RetentionInfo
  # Can the user opt out of this category's collection?
  userCanOptOut: SignalValue!
  # Whether this data is required for the core service to function.
  requiredForService: SignalValue
  # Whether this data is required for legal or regulatory compliance.
  requiredForLaw: SignalValue
}

# Signals derived from privacy actions/capabilities (not category-specific).
type CapabilitySignals {
  supportsAccountCreation: SignalValue!
  supportsAccountDeletion: SignalValue!
  supportsDataDeletionRequests: SignalValue!
  supportsDataExport: SignalValue!
  supportsSubscriptions: SignalValue!
  sellsPersonalInformation: SignalValue!
  usesCookiesOrTracking: SignalValue!
}

# Aggregated risk indicators derived from categories and capabilities.
type RiskIndicators {
  # Total number of data categories collected.
  dataCollectionBreadth: Int!
  # Sensitive categories collected for non-essential purposes.
  collectsSensitiveDataForNonEssentialPurposes: SignalValue!
  # Whether data selling is indicated.
  sellsPersonalInformation: SignalValue!
  # Longest known retention period in days across all categories.
  maxRetentionDays: Int
  # Whether any category has indefinite retention.
  hasIndefiniteRetention: SignalValue!
  # Not determinable from policy analysis alone.
  encryptionPractices: SignalValue!
  # Not determinable from policy analysis alone.
  breachRisk: SignalValue!
}

# A single scoring aspect and its contribution to the overall score.
type ScoreContribution {
  # Identifier for the scoring aspect (e.g. 'dataCollection', 'dataSharing').
  aspect: String!
  # Numeric contribution to the score (negative = penalty, positive = bonus).
  contribution: Float!
}

# Overall privacy score for an organization.
type PrivacyScore {
  # Numeric score (0-100). Higher is better.
  score: Float!
  # Breakdown of how each aspect contributed to the score.
  breakdown: [ScoreContribution!]!
}

# Concise human-readable summary of privacy-related findings.
type PrivacySummary {
  # Up to 5 key takeaways, deterministically generated.
  bulletPoints: [String!]!
  # URL of the source material that was analyzed.
  sourceUrl: String!
  # When the source material was last updated (as reported by the organization).
  sourceLastUpdated: String
}

# The structured data payload for an analysis result.
type AnalysisResultData {
  # Overall privacy score for the organization. Null when scoring is disabled.
  privacyScore: PrivacyScore
  # Concise human-readable summary.
  privacySummary: PrivacySummary!
  # Per-category signal breakdown.
  categories: [CategorySignals!]!
  # Action-derived capability signals (not category-specific).
  capabilities: CapabilitySignals!
  # Aggregated risk indicators.
  riskIndicators: RiskIndicators!
  # Organization identity (brand, company, business categories).
  organizationIdentity: OrganizationIdentity
}

# The protection state of a data holder.
enum DataHolderProtectionState {
  MONITORED
  ACTION_REQUESTED
  RESOLVED
}

type VirtualPresence {
  # Unique ID of the virtual presence.
  id: ID!

  # The type of presence (e.g email, social, etc.).
  providerType: ProviderType!

  # The presence identifier (e.g. email address).
  identifier: String!

  # Current state (connected, scanning, needs_reauth, error).
  state: VirtualPresenceState!

  # Time in milliseconds since 1970-01-01T00:00:00Z of most recent scan
  lastScannedAtEpochMs: Float!

  owner: ID!
  version: Int!
  createdAtEpochMs: Float!
  updatedAtEpochMs: Float!
}

type VirtualPresenceConnection {
  items: [VirtualPresence!]!
  nextToken: String
}

type DataHolder {
  # Unique ID of the data holder.
  id: ID!

  # ID of the virtual presence this data holder is associated with.
  virtualPresenceId: ID!

  # Domain name of the data holder (e.g. "google.com").
  domainName: String!

  # Display name of the data holder (e.g. "Google").
  name: String!

  # Current protection state.
  protectionState: DataHolderProtectionState!

  # Whether there is a compliance concern with this data holder.
  complianceConcern: Boolean!

  # Time in milliseconds since 1970-01-01T00:00:00Z of the most recent interaction.
  mostRecentInteractionEpochMs: Float!

  owner: ID!
  version: Int!
  createdAtEpochMs: Float!
  updatedAtEpochMs: Float!
}

type DataHolderConnection {
  items: [DataHolder!]!
  nextToken: String
}

type AnalysisResult {
  id: ID!
  virtualPresenceId: ID!
  dataHolderIdentifier: String!
  status: AnalysisResultStatus!
  lastAnalyzedAtEpochMs: Float!
  # Structured analysis data. Populated when status is COMPLETE or PARTIAL.
  data: AnalysisResultData
  owner: ID!
  version: Int!
  createdAtEpochMs: Float!
  updatedAtEpochMs: Float!
}

type AnalysisResultConnection {
  items: [AnalysisResult!]!
  nextToken: String
}

# Lightweight notification payload for subscription updates.
# Does not include the full data payload — clients should query
# getAnalysisResult for the complete typed data.
type AnalysisResultUpdate {
  id: ID!
  virtualPresenceId: ID!
  dataHolderIdentifier: String!
  status: AnalysisResultStatus!
  lastAnalyzedAtEpochMs: Float!
  owner: ID!
  version: Int!
  createdAtEpochMs: Float!
  updatedAtEpochMs: Float!
}

# A single data holder update item with its change type.
type DataHolderUpdateItem {
  id: ID!
  virtualPresenceId: ID!
  domainName: String!
  name: String!
  protectionState: DataHolderProtectionState!
  complianceConcern: Boolean!
  mostRecentInteractionEpochMs: Float!
  owner: ID!
  version: Int!
  createdAtEpochMs: Float!
  updatedAtEpochMs: Float!
}

"""
A batch of data holder updates emitted during discovery.
Contains all data holders discovered in a single page with their change types.
"""
type DataHoldersUpdate {
  items: [DataHolderUpdateItem!]!
  owner: ID!
}

# Input to listVirtualPresences query.
input ListVirtualPresencesInput {
  limit: Int
  nextToken: String
}

# Input for providing a pre-obtained refresh token credential.
input RefreshTokenInput {
  refreshToken: String!
  providerIdentity: String!
  scopes: [String!]
  expiresInEpochMs: Float
}

# Input to connectVirtualPresence mutation.
input ConnectVirtualPresenceInput {
  authCode: String
  refreshToken: RefreshTokenInput
}

# Options to control the scope and limits of a rescan.
input ScanOptionsInput {
  maximumItemsProcessed: Int
  earliestScanDate: String
  latestScanDate: String
  excludeDomains: [String!]
  excludeCategories: [String!]
}

type Query {
  """
  List virtual presences for the authenticated user
  """
  listVirtualPresences(
    input: ListVirtualPresencesInput
  ): VirtualPresenceConnection!

  """
  Get a single data holder by ID
  """
  getDataHolder(id: ID!): DataHolder

  """
  List data holders by virtual presence
  """
  listDataHolders(
    virtualPresenceId: ID!
    limit: Int
    nextToken: String
  ): DataHolderConnection!

  """
  Get a full analysis result by ID, including typed data.
  """
  getAnalysisResult(id: ID!): AnalysisResult

  """
  List analysis results for a virtual presence.
  """
  listAnalysisResults(
    virtualPresenceId: ID!
    limit: Int
    nextToken: String
  ): AnalysisResultConnection!
}

type Mutation {
  """
  Connect a virtual presence.
  """
  connectVirtualPresence(input: ConnectVirtualPresenceInput): VirtualPresence!

  """
  Disconnect a virtual presence.
  """
  disconnectVirtualPresence(id: String!): VirtualPresence!

  """
  Rescan an existing virtual presence for new data holders.
  Scans from the last scan date forward.
  """
  rescanVirtualPresence(
    id: String!
    options: ScanOptionsInput
  ): VirtualPresence!
}

type Subscription {
  """
  Subscribe to analysis result updates for the authenticated user.
  Emitted each time an analysis result is created or updated.
  Use getAnalysisResult to fetch the full typed data.
  """
  onAnalysisResultUpdate(owner: ID!): AnalysisResultUpdate

  """
  Subscribe to virtual presence state updates for the authenticated user.
  Emitted when a virtual presence changes state (e.g. to NEEDS_REAUTH).
  """
  onVirtualPresenceUpdate(owner: ID!): VirtualPresence

  """
  Subscribe to batch data holder updates during discovery.
  Emitted once per discovery page with all data holders found in that page.
  """
  onDataHoldersUpdate(owner: ID!): DataHoldersUpdate
}
