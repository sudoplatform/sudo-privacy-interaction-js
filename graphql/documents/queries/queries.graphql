query GetProviderConfiguration {
  getProviderConfiguration {
    data
  }
}

query ListVirtualPresences($input: ListVirtualPresencesInput) {
  listVirtualPresences(input: $input) {
    items {
      ...VirtualPresenceFields
    }
    nextToken
  }
}

query GetDataHolder($id: ID!) {
  getDataHolder(id: $id) {
    ...DataHolderFields
  }
}

query ListDataHolders(
  $virtualPresenceId: ID!
  $limit: Int
  $nextToken: String
) {
  listDataHolders(
    virtualPresenceId: $virtualPresenceId
    limit: $limit
    nextToken: $nextToken
  ) {
    items {
      ...DataHolderFields
    }
    nextToken
  }
}

query GetAnalysisResult($id: ID!) {
  getAnalysisResult(id: $id) {
    ...AnalysisResultFields
  }
}

query GetOrganizationAnalysis($domain: String!, $mode: OrganizationAnalysisMode) {
  getOrganizationAnalysis(domain: $domain, mode: $mode) {
    ...OrganizationAnalysisFields
  }
}

query ListAnalysisResults(
  $virtualPresenceId: ID!
  $limit: Int
  $nextToken: String
) {
  listAnalysisResults(
    virtualPresenceId: $virtualPresenceId
    limit: $limit
    nextToken: $nextToken
  ) {
    items {
      ...AnalysisResultFields
    }
    nextToken
  }
}

query ListDataHolderScanSummaries(
  $dataHolderId: ID!
  $limit: Int
  $nextToken: String
) {
  listDataHolderScanSummaries(
    dataHolderId: $dataHolderId
    limit: $limit
    nextToken: $nextToken
  ) {
    items {
      ...DataHolderScanSummaryFields
    }
    nextToken
  }
}
