fragment AnalysisResultDataFields on AnalysisResultData {
  privacyScore {
    score
    breakdown {
      aspect
      contribution
    }
    coverage {
      evaluated
      total
    }
  }
  privacySummary {
    bulletPoints
    sourceUrl
    sourceLastUpdated
  }
  categories {
    category
    collected
    dataLabels
    sharedWithThirdParties
    monetized
    retained
    retention {
      style
      timeInDays
      additionalInfo
    }
    userCanOptOut
    requiredForService
    requiredForLaw
  }
  capabilities {
    supportsAccountCreation
    supportsAccountDeletion
    supportsDataDeletionRequests
    supportsDataExport
    supportsSubscriptions
    sellsPersonalInformation
    usesCookiesOrTracking
    supportsTwoFactorAuth
  }
  riskIndicators {
    dataCollectionBreadth
    collectsSensitiveDataForNonEssentialPurposes
    sellsPersonalInformation
    maxRetentionDays
    hasIndefiniteRetention
    encryptionPractices
    breachRisk
  }
  organizationIdentity {
    brandName
    companyName
    primaryCategory
    categories
  }
  attribution
}

fragment AnalysisResultFields on AnalysisResult {
  id
  virtualPresenceId
  dataHolderIdentifier
  status
  lastAnalyzedAtEpochMs
  data {
    ...AnalysisResultDataFields
  }
  owner
  version
  createdAtEpochMs
  updatedAtEpochMs
}
