fragment VirtualPresenceFields on VirtualPresence {
  id
  providerType
  identifier
  state
  lastScannedAtEpochMs
  lastScanFailureReason
  dataHolderCount {
    count
    monitored
    initiatedActions
    completedActions
    archived
  }
  owner
  version
  createdAtEpochMs
  updatedAtEpochMs
}
