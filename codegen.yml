overwrite: true
schema:
  - './graphql/schema/**/*.graphql'
generates:
  src/gen/schema-types.ts:
    plugins:
      - typescript
    config:
      scalars:
        ID:
          input: 'string'
          output: 'string'
      skipTypename: true
      enumsAsTypes: true
      futureProofEnums: true
  src/gen/graphqlTypes.ts:
    documents:
      - './graphql/documents/**/*.graphql'
    plugins:
      - add:
          content: '// Sourcecode generated by graphql-codegen. DO NOT EDIT!'
      - add:
          content: '/* eslint-disable */'
      - add:
          content: "export * from './schema-types';"
      - typescript-operations
      - typed-document-node:
          onlyOperationTypes: true
    config:
      skipTypename: true
      enumsAsTypes: true
      futureProofEnums: true
hooks:
  afterAllFileWrite:
    - prettier --write
